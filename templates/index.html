<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Movie Recommendation System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="hero">
            <h1>🎬 Movie Recommendation System</h1>
            <p>Discover movies similar to your favorites</p>
        </div>

        <form action="/recommend" method="post" class="search-box">

            <select name="movie" required>
                <option value="">🎥 Select a Movie</option>

                {% for movie in movies %}
                <option value="{{ movie }}"
                    {% if selected_movie == movie %}selected{% endif %}>
                    {{ movie }}
                </option>
                {% endfor %}
            </select>

            <button type="submit">
                Recommend Movies
            </button>

        </form>

        {% if recommendations %}

        <div class="recommend-section">

            <h2>✨ Recommended For You</h2>

            <div class="movie-container">

                {% for i in range(recommendations|length) %}

                <div class="movie-card">

                    <div class="poster-wrapper">
                        <img src="{{ posters[i] }}"
                             alt="{{ recommendations[i] }}">
                    </div>

                    <div class="movie-info">
                        <h3>{{ recommendations[i] }}</h3>
                    </div>

                </div>

                {% endfor %}

            </div>

        </div>

        {% endif %}

    </div>

</body>
</html>
